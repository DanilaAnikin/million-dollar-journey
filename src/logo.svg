<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="120" fill="#0f172a" />
  
  <defs>
    <linearGradient id="growthGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" /> <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" /> </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <path 
    d="M 100 350 L 200 200 L 280 280 L 410 130" 
    stroke="url(#growthGradient)" 
    stroke-width="45" 
    fill="none" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <circle cx="410" cy="130" r="30" fill="#10b981" />
  
  <path d="M 80 400 L 432 400" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <path d="M 80 300 L 432 300" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
  <path d="M 80 200 L 432 200" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
</svg>
